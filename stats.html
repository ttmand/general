  <html>
  <head>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
      google.charts.load('current', {'packages':['corechart']});
      google.charts.setOnLoadCallback(drawChart);

      function drawChart() {
        var data = google.visualization.arrayToDataTable([
          ['Month', 'Tanks destroyed'],
          ['Jul 2025',  1536218],
          ['Sep 2025',  1656970],
          ['Aug 2025',  1365243],
          ['Oct 2025',  1653521],
          ['Nov 2025',  1792135],
          ['Dec 2025',  1671332],
          ['Jan 2026',      1620402],
          ['Feb 2026',  1557586]
        ]);

        var options = {
          title: 'Tanks destroyed per month',
          curveType: 'function',
          legend: { position: 'bottom' }
        };

        var chart = new google.visualization.LineChart(document.getElementById('tanksdestroyed'));

        chart.draw(data, options);
      }
    </script>
  </head>
  <body>
    <div id="tanksdestroyed" style="width: 900px; height: 500px"></div>
  </body>
</html>
